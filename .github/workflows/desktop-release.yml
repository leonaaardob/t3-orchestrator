name: Desktop Release

# Fork-owned T3 Orchestrator desktop builds for leonaaardob/t3-orchestrator.
# Intentionally omits upstream release.yml concerns: npm OIDC, Vercel, Apple
# signing, Azure Trusted Signing, relay production secrets, and AUR.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (defaults to apps/desktop package.json)"
        required: false
        type: string
      publish_release:
        description: "Publish a GitHub Release after all builds succeed"
        required: false
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.release_name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      publish_release: ${{ steps.release_meta.outputs.publish_release }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail

          if [[ -n "${DISPATCH_VERSION:-}" ]]; then
            version="${DISPATCH_VERSION#v}"
          else
            version="$(node -p "require('./apps/desktop/package.json').version")"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_name=T3 Orchestrator $version" >> "$GITHUB_OUTPUT"
          echo "publish_release=${PUBLISH_RELEASE:-false}" >> "$GITHUB_OUTPUT"

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build_wsl_node_pty:
    name: Build WSL node-pty (${{ matrix.arch }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...

      - name: Build node-pty Linux prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-${{ matrix.arch }}
          path: wsl-prebuild/pty.node
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight, build_wsl_node_pty]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            artifact: t3-planning-macos-arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            artifact: t3-planning-macos-x64
            runner: macos-15
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
          - label: Windows x64
            artifact: t3-planning-windows-x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Windows arm64
            artifact: t3-planning-windows-arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
          - label: Linux x64
            artifact: t3-planning-linux-x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: Linux arm64
            artifact: t3-planning-linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: ${{ matrix.platform != 'win' }}
          run-install: false

      - name: Resolve Windows package cache path
        if: matrix.platform == 'win'
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        if: matrix.platform == 'win'
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-desktop-release-packages-v1-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Load public configuration
        shell: bash
        run: cp .env.example .env

      - name: Download WSL node-pty prebuild
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-${{ matrix.arch }}
          path: wsl-prebuild

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $component = if ("${{ matrix.arch }}" -eq "arm64") {
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64.Spectre"
          } else {
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre"
          }
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            $component, "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail

          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node")
          fi

          echo "Building unsigned ${{ matrix.label }} (no signing secrets)."
          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              # Skip electron-builder debug dumps; they are not updater assets.
              # Matches builder-debug.yml and builder-debug-*.yml (see
              # scripts/lib/release-assets.ts).
              base="$(basename "$file")"
              if [[ "$base" == "builder-debug.yml" || "$base" == builder-debug-* ]]; then
                continue
              fi
              cp "$file" release-publish/
            done
          done

          # Per-arch suffix so the release job can merge multi-arch updater
          # metadata without overwrite collisions.
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          if [[ "${{ matrix.platform }}" == "win" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*.yml; do
              mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
            done
          fi

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*-linux.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 14

  release:
    # Always aggregate/validate the release payload after builds. GitHub Release
    # creation stays gated on publish_release so dry runs prove merge + assets.
    name: Aggregate release payload
    needs: [preflight, build]
    if: >-
      ${{ !failure() && !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: t3-planning-*
          merge-multiple: true
          path: release-assets

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Defense in depth: drop any builder-debug dumps that slipped through
          # collect (exact name or renamed builder-debug-win-*.yml).
          for debug_file in release-assets/builder-debug.yml release-assets/builder-debug-*; do
            if [[ -e "$debug_file" ]]; then
              echo "Removing non-release builder debug dump: $debug_file"
              rm -f "$debug_file"
            fi
          done

          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

          found_windows_manifest=false
          for x64_manifest in release-assets/*-win-x64.yml; do
            if [[ "$(basename "$x64_manifest")" == builder-debug-* ]]; then
              continue
            fi
            arm64_manifest="${x64_manifest/-x64.yml/-arm64.yml}"
            output_manifest="${x64_manifest/-win-x64.yml/.yml}"
            if [[ ! -f "$arm64_manifest" ]]; then
              echo "Missing matching arm64 Windows manifest for $x64_manifest" >&2
              exit 1
            fi
            found_windows_manifest=true
            node scripts/merge-update-manifests.ts --platform win \
              "$arm64_manifest" \
              "$x64_manifest" \
              "$output_manifest"
            rm -f "$arm64_manifest" "$x64_manifest"
          done
          if [[ "$found_windows_manifest" != true ]]; then
            echo "No Windows updater manifests found to merge." >&2
            exit 1
          fi

          found_linux_manifest=false
          for x64_manifest in release-assets/*-linux-x64.yml; do
            arm64_manifest="${x64_manifest/-x64.yml/-arm64.yml}"
            output_manifest="${x64_manifest/-linux-x64.yml/-linux.yml}"
            if [[ ! -f "$arm64_manifest" ]]; then
              echo "Missing matching arm64 Linux manifest for $x64_manifest" >&2
              exit 1
            fi
            found_linux_manifest=true
            node scripts/merge-update-manifests.ts --platform linux \
              "$arm64_manifest" \
              "$x64_manifest" \
              "$output_manifest"
            rm -f "$arm64_manifest" "$x64_manifest"
          done
          if [[ "$found_linux_manifest" != true ]]; then
            echo "No Linux updater manifests found to merge." >&2
            exit 1
          fi

          echo "Release assets after manifest merge:"
          ls -la release-assets

      - name: Validate release payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          missing=0
          for required in \
            release-assets/latest-mac.yml \
            release-assets/latest.yml \
            release-assets/latest-linux.yml; do
            if [[ ! -f "$required" ]]; then
              echo "Missing merged updater manifest: $required" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          debug_leaks=(release-assets/builder-debug.yml release-assets/builder-debug-*)
          for leak in "${debug_leaks[@]}"; do
            if [[ -e "$leak" ]]; then
              echo "builder-debug dump must not remain in release payload: $leak" >&2
              exit 1
            fi
          done

          leftover_per_arch=(
            release-assets/*-mac-x64.yml
            release-assets/*-win-x64.yml
            release-assets/*-win-arm64.yml
            release-assets/*-linux-x64.yml
            release-assets/*-linux-arm64.yml
          )
          for leftover in "${leftover_per_arch[@]}"; do
            if [[ -e "$leftover" ]]; then
              echo "Per-arch updater manifest should have been merged away: $leftover" >&2
              exit 1
            fi
          done

          echo "Would-be GitHub Release assets:"
          for pattern in \
            release-assets/*.dmg \
            release-assets/*.zip \
            release-assets/*.AppImage \
            release-assets/*.exe \
            release-assets/*.blockmap \
            release-assets/*.yml; do
            for file in $pattern; do
              basename "$file"
            done
          done | sort

          echo "--- latest-mac.yml ---"
          cat release-assets/latest-mac.yml
          echo "--- latest.yml ---"
          cat release-assets/latest.yml
          echo "--- latest-linux.yml ---"
          cat release-assets/latest-linux.yml

          if ! grep -q 'blockMapSize:' release-assets/latest-linux.yml; then
            echo "Merged latest-linux.yml is missing blockMapSize" >&2
            exit 1
          fi
          if ! grep -q 'x86_64.AppImage' release-assets/latest-linux.yml; then
            echo "Merged latest-linux.yml is missing x86_64 AppImage entry" >&2
            exit 1
          fi
          if ! grep -q 'arm64.AppImage' release-assets/latest-linux.yml; then
            echo "Merged latest-linux.yml is missing arm64 AppImage entry" >&2
            exit 1
          fi

          echo "publish_release=${{ needs.preflight.outputs.publish_release }}"
          if [[ "${{ needs.preflight.outputs.publish_release }}" != "true" ]]; then
            echo "Dry run: release payload validated; skipping GitHub Release publish."
          fi

      - name: Guard release repository
        if: ${{ needs.preflight.outputs.publish_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "leonaaardob/t3-orchestrator" ]]; then
            echo "Refusing to publish desktop release outside leonaaardob/t3-orchestrator (got $GITHUB_REPOSITORY)." >&2
            exit 1
          fi

      - name: Publish release
        if: ${{ needs.preflight.outputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          body: |
            T3 Orchestrator — first desktop release.

            Project-level orchestration for T3 Code.

            Includes:
            - Project Supervisor
            - Agent Board
            - autonomous scheduler/reconciler
            - cross-provider implementation/review/repair presets
            - independent review
            - bounded repair cycles
            - macOS, Windows and Linux desktop builds

            Status:
            Experimental.

            Desktop binaries are currently unsigned.
            macOS may show a Gatekeeper warning; Windows may show SmartScreen.
            Do not disable system-wide protections.

            This is not the official T3 Code project.
            Upstream lives at https://github.com/pingdotgg/t3code.
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}
